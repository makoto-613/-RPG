<meta charset="utf-8">
<title>マルクヴィエ物語 謎解き篇</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 配置：紫のヘッダー帯の下に象牙色のパネル。
   プレイ画面は「洞窟の窓」→「台詞パネル」→「操作盤」の縦並び。広い画面では窓の右に台詞と操作盤が並ぶ。
   色と部品は、ご提供のUIキット（象牙色のパネル・紫の帯・青緑／赤の丸ボタン・数字ボタン・五角形の矢印）に合わせている。 */
:root {
  --ivory: #F9F8F1; --paper: #FDFDF9; --parch: #E0D0BD; --sand: #D8D0B4;
  --plum: #5E4D5A; --plum-d: #3E333C; --plum-m: #665262;
  --olive: #687A24; --lime: #A6AE38; --lime-l: #BEC740;
  --teal: #2F877C; --rose: #B23A52; --amber: #E8A02A; --ink: #3A2F38; --mute: #7A6B77; --cave: #171322;
  --c1: #3fb6c4; --c2: #eaa83a; --c3: #dc6a86;
  --font-h: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --font-b: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif;
  --u-bg: url(@@ui/bg.webp@@);
  --u-hdr: url(@@ui/hdrtile.png@@);
  --u-gr: url(@@ui/button_gr.png@@); --u-gr-h: url(@@ui/button_gr_hover.png@@); --u-gr-c: url(@@ui/button_gr_click.png@@);
  --u-rd: url(@@ui/button_rd.png@@); --u-rd-h: url(@@ui/button_rd_hover.png@@); --u-rd-c: url(@@ui/button_rd_click.png@@);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ivory) var(--u-bg) center top / cover fixed; color: var(--ink);
  font: 500 15px/1.65 var(--font-b); letter-spacing: .02em; min-height: 100vh;
  word-break: auto-phrase;   /* 対応ブラウザでは、カタカナ語などの途中で改行しにくくなる */
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- ヘッダー帯 ---------- */
.hdr { background: var(--plum-d) var(--u-hdr) 0 0 / 75px 72px repeat-x; color: #fff; position: relative; }
.hdr::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20, 8, 20, .28), rgba(255, 255, 255, .10)); pointer-events: none; }
.hdr-in { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; height: 72px; display: flex; align-items: center; gap: 12px; }
.emb { width: 40px; height: 40px; flex: none; background: url(@@ui/emblem.png@@) center / contain no-repeat; }
.hdr-t { font: 700 20px/1.2 var(--font-h); letter-spacing: .08em; text-shadow: 0 2px 0 rgba(30, 14, 28, .55); min-width: 0; overflow-wrap: anywhere; word-break: auto-phrase; text-wrap: balance; }
.hdr-s { font: 500 11px/1.2 var(--font-b); opacity: .85; letter-spacing: .14em; margin-top: 3px; }
.hdr-grow { flex: 1; min-width: 0; }
.hdr-r { display: flex; align-items: center; gap: 8px; flex: none; }
.kchip { display: inline-flex; align-items: baseline; gap: 5px; background: rgba(249, 248, 241, .16); border: 1.5px solid rgba(249, 248, 241, .55); border-radius: 999px; padding: 3px 11px 3px 9px; font: 700 12px/1.3 var(--font-b); white-space: nowrap; cursor: pointer; color: #fff; }
.kchip b { font: 700 17px/1 var(--font-h); }
.kchip:hover { background: rgba(249, 248, 241, .28); }
.iconbtn { width: 44px; height: 44px; border: 0; padding: 0; background: transparent center / contain no-repeat; cursor: pointer; flex: none; }
.iconbtn.back { background-image: url(@@ui/button_back_02.png@@); }
.iconbtn.back:hover { background-image: url(@@ui/button_back_02_hover.png@@); }
.iconbtn.back:active { background-image: url(@@ui/button_back_02_click.png@@); }

/* ---------- 青緑／赤の丸ボタン（キットの画像を9分割して伸ばす） ---------- */
.kbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 112px; min-height: 46px; padding: 6px 26px; border: 0; background: none; cursor: pointer;
  font: 700 15px/1.2 var(--font-b); letter-spacing: .06em; color: #fff; text-shadow: 0 1px 0 rgba(0, 40, 36, .6); isolation: isolate; -webkit-tap-highlight-color: transparent; }
.kbtn::before { content: ""; position: absolute; inset: 0; z-index: -1; border: 22px solid transparent; border-image: var(--u-gr) 24 fill / 22px stretch; }
.kbtn:hover::before { border-image-source: var(--u-gr-h); }
.kbtn:active::before { border-image-source: var(--u-gr-c); }
.kbtn.rd { text-shadow: 0 1px 0 rgba(70, 0, 20, .6); }
.kbtn.rd::before { border-image-source: var(--u-rd); }
.kbtn.rd:hover::before { border-image-source: var(--u-rd-h); }
.kbtn.rd:active::before { border-image-source: var(--u-rd-c); }
.kbtn.sm { min-height: 40px; min-width: 88px; padding: 4px 18px; font-size: 13px; }
.kbtn.sm::before { border-width: 19px; border-image-width: 19px; }
.kbtn[disabled] { filter: grayscale(.8) brightness(.9); cursor: default; }

/* ---------- パネル ---------- */
.panel { background: var(--paper) var(--u-bg) center / cover; border: 2px solid var(--plum); border-radius: 16px;
  box-shadow: 0 0 0 3px var(--ivory), 0 0 0 4.5px rgba(94, 77, 90, .4), 0 10px 20px rgba(62, 51, 60, .16); }
.h2 { font: 700 18px/1.3 var(--font-h); color: var(--plum-d); letter-spacing: .1em; margin: 0; display: flex; align-items: center; gap: 8px; }
.h2::before { content: ""; width: 12px; height: 12px; background: linear-gradient(135deg, var(--lime-l), var(--olive)); transform: rotate(45deg); border: 1.5px solid var(--plum); flex: none; }
.pill { display: inline-block; font: 700 11px/1 var(--font-b); letter-spacing: .06em; border-radius: 999px; padding: 4px 8px; border: 1.5px solid var(--plum); background: var(--ivory); color: var(--plum); white-space: nowrap; }
.pill.k { background: #fbe3c6; border-color: #b9741a; color: #8a4f06; }
.pill.once { background: #e2efd0; border-color: var(--olive); color: #46571a; }
.pill.prov { background: #ece6f5; border-color: #7d69a6; color: #5a4784; }
.pill.ok { background: #dff0ea; border-color: var(--teal); color: #1e6a60; }
.notes-off .pill.k, .notes-off .pill.prov, .notes-off .pill.once { display: none; }

main { max-width: 1120px; margin: 0 auto; padding-block: 18px 40px; }
.screen[hidden] { display: none !important; }

/* ---------- タイトル／区画えらび ---------- */
.hero { position: relative; border: 2px solid var(--plum); border-radius: 16px; overflow: hidden; background: var(--cave); box-shadow: 0 0 0 3px var(--ivory), 0 0 0 4.5px rgba(94, 77, 90, .4), 0 10px 20px rgba(62, 51, 60, .2); }
.hero canvas { display: block; width: 100%; height: auto; }
.title-grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .title-grid { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } }
.premise { margin-top: 18px; padding: 18px 16px 14px; position: relative; min-width: 0; overflow-wrap: anywhere; }
.premise .np { top: -13px; left: 14px; }
.np { position: absolute; z-index: 2; min-width: 84px; text-align: center; padding: 3px 16px 3px; border: 2px solid var(--plum-d); border-radius: 10px; color: #fff; font: 700 14px/1.5 var(--font-h); letter-spacing: .12em;
  background: linear-gradient(180deg, #7b6679, #5e4d5a 55%, #4a3c47); box-shadow: 0 2px 0 rgba(30, 14, 28, .35); text-shadow: 0 1px 0 rgba(30, 14, 28, .5); }
.line { font: 500 16px/1.85 var(--font-b); color: var(--ink); }
.src { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--mute); }
.list { padding: 16px 14px 18px; display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
#cards { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.list .h2 { padding: 2px 4px 4px; }
.card { min-width: 0; overflow-wrap: anywhere; display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; cursor: pointer; padding: 10px 12px 10px 10px; border-radius: 14px; border: 2px solid var(--plum); background: var(--ivory); box-shadow: 0 3px 0 rgba(62, 51, 60, .22); }
.card:hover { background: #fff; transform: translateY(-1px); }
.card:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(62, 51, 60, .22); }
.num { width: 60px; height: 64px; background: center / 100% 100% no-repeat; flex: none; }
.num.n1 { background-image: url(@@ui/button_number_1.png@@); } .card:hover .n1 { background-image: url(@@ui/button_number_1_hover.png@@); } .card.done .n1 { background-image: url(@@ui/button_number_1_active.png@@); }
.num.n2 { background-image: url(@@ui/button_number_2.png@@); } .card:hover .n2 { background-image: url(@@ui/button_number_2_hover.png@@); } .card.done .n2 { background-image: url(@@ui/button_number_2_active.png@@); }
.num.n3 { background-image: url(@@ui/button_number_3.png@@); } .card:hover .n3 { background-image: url(@@ui/button_number_3_hover.png@@); } .card.done .n3 { background-image: url(@@ui/button_number_3_active.png@@); }
.num.n5 { background-image: url(@@ui/button_number_5.png@@); } .card:hover .n5 { background-image: url(@@ui/button_number_5_hover.png@@); } .card.done .n5 { background-image: url(@@ui/button_number_5_active.png@@); }
.num.n9 { background-image: url(@@ui/button_number_9.png@@); } .card:hover .n9 { background-image: url(@@ui/button_number_9_hover.png@@); } .card.done .n9 { background-image: url(@@ui/button_number_9_active.png@@); }
.card .nm { font: 700 17px/1.3 var(--font-h); letter-spacing: .06em; color: var(--plum-d); }
.card .nn { margin-right: .7em; }
.card .nt { display: inline-block; }   /* 区画名は1つのかたまりとして折り返す（「水/門」のような1文字残りを避ける） */
.card .kd { font-size: 13px; color: var(--mute); margin-top: 2px; line-height: 1.5; }
.card .st { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--mute); white-space: nowrap; }
.start-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 4px 4px 0; }
.fine { font-size: 12.5px; color: var(--mute); line-height: 1.7; }

/* ---------- プレイ画面 ---------- */
.play { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 940px) { .play { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 28px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12.5px/1.2 var(--font-b); padding: 5px 11px; border-radius: 999px; background: var(--ivory); border: 1.5px solid var(--plum); color: var(--plum-d); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.good { background: #dff0ea; border-color: var(--teal); color: #1c6358; }
.chip.warn { background: #fbe0e4; border-color: var(--rose); color: #8f2a40; }
.chip .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--plum-d); flex: none; }
.chip .fl { width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #ffcf5c; border: 1.5px solid #b9741a; flex: none; }
.chip .fl.off { background: transparent; border-color: #b8a9b4; }
.cvwrap { position: relative; border: 3px solid var(--plum); border-radius: 14px; overflow: hidden; background: var(--cave); box-shadow: 0 0 0 3px var(--ivory), 0 0 0 4.5px rgba(94, 77, 90, .4), 0 10px 20px rgba(62, 51, 60, .22); touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { display: block; width: 100%; height: auto; aspect-ratio: 11 / 9; }
.side { display: grid; gap: 12px; }
.msg { position: relative; min-height: 112px; padding: 20px 16px 16px; cursor: pointer; }
.msg .np { top: -14px; left: 14px; }
.msg .np[hidden] { display: none; }
.msg-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.msg-body.noface { grid-template-columns: minmax(0, 1fr); }
.face { width: 60px; height: 60px; border-radius: 12px; border: 2px solid var(--plum); background: linear-gradient(180deg, #8d7a8b, #5e4d5a); flex: none; }
.face[hidden] { display: none; }
.mtext { font: 500 15.5px/1.8 var(--font-b); color: var(--ink); min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.mtext.sys { color: #4b5a1c; font-weight: 500; }
.mtext.plq { font-family: var(--font-h); font-weight: 700; letter-spacing: .1em; color: #5a3f12; }
.mtext.nar { color: #4a3f48; }
.msg .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.msg .meta:empty { display: none; }
.nxt { position: absolute; right: 14px; bottom: 10px; width: 24px; height: 24px; background: url(@@ui/nextpage.png@@) center / contain no-repeat; animation: bob 0.9s ease-in-out infinite; }
.nxt[hidden] { display: none; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
.choices { display: grid; gap: 8px; }
.choices:empty { display: none; }
.ch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 54px; padding: 8px 16px 8px 18px; text-align: left; cursor: pointer; position: relative; isolation: isolate; border: 0; background: none; color: #fff; font: 700 15px/1.5 var(--font-b); letter-spacing: .04em; text-shadow: 0 1px 0 rgba(0, 40, 36, .6); }
.ch::before { content: ""; position: absolute; inset: 0; z-index: -1; border: 24px solid transparent; border-image: var(--u-gr) 24 fill / 24px stretch; }
.ch:hover::before { border-image-source: var(--u-gr-h); }
.ch:active::before { border-image-source: var(--u-gr-c); }
.ch .tg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pad { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 12px 14px 14px; }
.dpad { display: grid; grid-template-columns: 40px 76px 40px; grid-template-rows: 44px 80px 44px; gap: 0; justify-items: center; align-items: center; touch-action: manipulation; }
.ar { border: 0; padding: 0; background: center / 100% 100% no-repeat; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.ar.u { grid-column: 2; grid-row: 1; width: 76px; height: 44px; background-image: url(@@ui/arrow_02_up.png@@); } .ar.u:hover { background-image: url(@@ui/arrow_02_up_hover.png@@); } .ar.u:active, .ar.u.on { background-image: url(@@ui/arrow_02_up_click.png@@); }
.ar.d { grid-column: 2; grid-row: 3; width: 76px; height: 44px; background-image: url(@@ui/arrow_02_down.png@@); } .ar.d:hover { background-image: url(@@ui/arrow_02_down_hover.png@@); } .ar.d:active, .ar.d.on { background-image: url(@@ui/arrow_02_down_click.png@@); }
.ar.l { grid-column: 1; grid-row: 2; width: 40px; height: 80px; background-image: url(@@ui/arrow_02_left.png@@); } .ar.l:hover { background-image: url(@@ui/arrow_02_left_hover.png@@); } .ar.l:active, .ar.l.on { background-image: url(@@ui/arrow_02_left_click.png@@); }
.ar.r { grid-column: 3; grid-row: 2; width: 40px; height: 80px; background-image: url(@@ui/arrow_02_right.png@@); } .ar.r:hover { background-image: url(@@ui/arrow_02_right_hover.png@@); } .ar.r:active, .ar.r.on { background-image: url(@@ui/arrow_02_right_click.png@@); }
.dpad .mid { grid-column: 2; grid-row: 2; }
.swap { min-width: 72px !important; padding: 4px 6px !important; font-size: 13px !important; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-content: center; }
.keys { font-size: 12px; color: var(--mute); padding: 0 6px; line-height: 1.6; }

/* ---------- 画面を覆うパネル（クリア・メニュー） ---------- */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(40, 28, 38, .58); display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; animation: fade .25s ease; }
.veil[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dlg { width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 0 0 18px; margin: auto; }
.dlg-h { background: var(--plum-d) var(--u-hdr) 0 0 / 75px 72px repeat-x; color: #fff; padding: 14px 18px 14px; border-radius: 13px 13px 0 0; display: flex; align-items: center; gap: 10px; position: relative; }
.dlg-h::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20, 8, 20, .28), rgba(255, 255, 255, .1)); border-radius: inherit; pointer-events: none; }
.dlg-h > * { position: relative; z-index: 1; }
.dlg-h .emb { width: 30px; height: 30px; }
.dlg-h h2 { margin: 0; font: 700 19px/1.3 var(--font-h); letter-spacing: .1em; text-shadow: 0 2px 0 rgba(30, 14, 28, .55); }
.dlg-b { padding: 16px 20px 0; display: grid; gap: 12px; }
.dlg-b .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.rows { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.rows li { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; font-size: 14px; border-bottom: 1px dashed rgba(94, 77, 90, .3); padding-bottom: 6px; }
.rows li b { font-family: var(--font-h); color: var(--plum-d); }
.sub { font: 700 13px/1.4 var(--font-h); letter-spacing: .1em; color: var(--olive); margin: 6px 0 0; }
.tgl { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.sw { position: relative; width: 54px; height: 30px; border-radius: 999px; border: 2px solid var(--plum); background: #cfc4cc; cursor: pointer; padding: 0; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--plum); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--teal); } .sw[aria-checked="true"]::after { transform: translateX(24px); }
.kbar { height: 12px; border-radius: 999px; border: 1.5px solid var(--plum); background: #e9e3d6; overflow: hidden; }
.kbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), var(--amber), var(--rose)); }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14px; }
.item .pill { margin-right: 4px; }
.fade-v { position: fixed; inset: 0; z-index: 40; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
.fade-v.on { opacity: 1; }
.ld { text-align: center; padding: 60px 0; font: 700 16px/1.6 var(--font-h); letter-spacing: .12em; color: var(--plum); }
.cr { font-size: 12.5px; line-height: 1.75; color: var(--mute); }
.cr a { color: var(--olive); word-break: break-all; }
@media (max-width: 560px) {
  .hdr-in { gap: 8px; }
  .hdr-t { font-size: 16px; letter-spacing: .03em; } .hdr-s { letter-spacing: .06em; }
  .hdr-s .hk { display: none; }                      /* 狭い画面では「｜ 二人で協力する謎」などの長い部分を隠す */
  .kchip { padding: 3px 9px 3px 8px; } .kbtn.sm { min-width: 72px; padding: 4px 12px; }
  .card { grid-template-columns: 52px minmax(0, 1fr); } .card .st { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; }
  .num { width: 52px; height: 55px; }
  .pad { gap: 10px; padding: 12px 10px 12px 12px; }
  .acts { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }
  .acts .kbtn { min-width: 0; width: 100%; }
  .mtext { font-size: 15px; }
}
@media (max-width: 400px) { .hdr-in > .emb { display: none; } .hdr-t { font-size: 15px; } }
.keys-touch { display: none; }
@media (hover: none) and (pointer: coarse) { .keys { display: none; } .keys-touch { display: block; } }
@media (prefers-reduced-motion: reduce) { .nxt { animation: none; } .veil { animation: none; } * { scroll-behavior: auto !important; } }
</style>

<div id="app">
  <header class="hdr"><div class="hdr-in gut">
