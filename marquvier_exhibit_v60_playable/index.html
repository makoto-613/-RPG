const walls=new Set(['0,0','1,0','5,0','6,0','0,6','6,6','3,2','3,3']);const xy=(a,b)=>`${a},${b}`,dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y),inBoard=(x,y)=>x>=0&&y>=0&&x<7&&y<7&&!walls.has(xy(x,y));
function reachable(from,steps,occupied=[],passFriends=false){let q=[{...from,n:0}],seen=new Map([[xy(from.x,from.y),0]]);for(let i=0;i<q.length;i++){let v=q[i];if(v.n>=steps)continue;for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){let x=v.x+dx,y=v.y+dy,k=xy(x,y);if(!inBoard(x,y)||seen.has(k)||occupied.some(o=>o.x===x&&o.y===y))continue;seen.set(k,v.n+1);q.push({x,y,n:v.n+1})}}return q}

function moveR(x,y){let b=s.battle;if(b.moved)return;let occ=[b.e];let moves=reachable(b.r,3,occ).filter(v=>!(v.x===b.f.x&&v.y===b.f.y));if(moves.some(v=>v.x===x&&v.y===y)){b.r={x,y};b.moved=true;log('ルノが移動した。');save();render()}}
function action(type){let b=s.battle;if(!b||b.acted||b.retreatPending)return;const fail=s.anxiety>=50?0.3:s.anxiety>=30?0.1:0;if(type==='staff'||type==='stone'){const status=attackStatus(type);if(!status.ok){log(status.reason);render();return;}if(type==='stone')b.stones--;let missed=Math.random()<fail;if(missed){change(0,5);log('恐怖で狙いが外れた。不安＋5');}else{let dmg=type==='staff'?10:7;b.enemyHp=Math.max(0,b.enemyHp-dmg);log(`${type==='staff'?'杖':'石弾'}が命中。敵HP−${dmg}`)}}else if(type==='guard'){b.guard=true;if(s.anxiety>=90)change(0,-5);log('ルノは防御の態勢を取った。')}else if(type==='calm'){if(s.anxiety>=90)return;change(0,-20);log('ルノは呼吸を整えた。不安−20')}else if(type==='call'){if(s.karma>=60||s.fhp<=0)return;let v=s.karma<30?15:s.karma<50?10:5;change(0,-v);log(`フラメトに呼びかけた。不安−${v}`)}else if(type==='crystal'){if(!b.boss||!s.crystal||b.turn<3)return;s.crystalUsed=true;s.battle=null;next();save();render();return}
b.runLast=(type==='staff'||type==='stone')?'attack':type;b.acted=true;if(wormRetreat())return;if(b.enemyHp<=0){s.battle=null;next();save();render();return}save();render()}

// Attack selection uses the same range rules for buttons, enemy tiles and auto-approach.
function attackStatus(kind){
 const b=s.battle;if(!b)return {ok:false,reason:'戦闘中ではありません'};
 if(b.acted)return {ok:false,reason:'行動済みです。「ターン終了」を押してください'};
 if(kind==='staff'&&s.anxiety>=70)return {ok:false,reason:'不安70以上で杖を使えません'};
 if(kind==='stone'&&s.anxiety>=50)return {ok:false,reason:'不安50以上で石弾を使えません'};
 if(kind==='stone'&&b.stones<=0)return {ok:false,reason:'石弾が残っていません'};
 const d=dist(b.r,b.e);
 if(kind==='staff'&&d!==1)return {ok:false,reason:`杖の射程は1マス（現在${d}マス）`};
 if(kind==='stone'&&(d<2||d>4))return {ok:false,reason:`石弾の射程は2〜4マス（現在${d}マス）`};
 return {ok:true,reason:''};
}
function approachAttack(){
 const b=s.battle;if(!b)return;
 if(b.acted){log('すでに行動しました。ターン終了で再び攻撃できます。');render();return;}
 const types=['staff','stone'];
 for(const type of types){if(attackStatus(type).ok){action(type);return}}
 if(b.moved){log('移動済みです。射程外の場合はターンを終了してください。');render();return;}
 // One-click approach finds the nearest reachable legal firing square.
 const possibilities=reachable(b.r,3,[b.e]).filter(v=>!(v.x===b.f.x&&v.y===b.f.y)).map(v=>{
  const d=dist(v,b.e);
  return {...v,kind:s.anxiety<70&&d===1?'staff':s.anxiety<50&&b.stones>0&&d>=2&&d<=4?'stone':null};
 }).filter(v=>v.kind).sort((a,c)=>a.n-c.n||(a.kind==='staff'?-1:1)||(a.y-c.y)||(a.x-c.x));
 if(possibilities.length){const dest=possibilities[0];b.r={x:dest.x,y:dest.y};b.moved=true;log(`ルノが${dest.n}マス移動して${dest.kind==='staff'?'杖':'石弾'}の射程に入った。`);action(dest.kind);return;}
 log('このターンは攻撃位置へ届きません。緑のマスへ移動するか、ターンを終了してください。');render();
}
// Find a shortest walkable route toward any square adjacent to a living target.
// Unlike Manhattan-only movement, this considers the entire board, so enemies
// will walk around walls even when the detour initially increases distance.
function shortestEnemyRoutes(start,targets,occupied){
 const adjacent=[];
 for(const t of targets){for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){
  const x=t.v.x+dx,y=t.v.y+dy;
  if(inBoard(x,y)&&!occupied.some(o=>o.x===x&&o.y===y))adjacent.push({x,y,target:t});
 }}
 const goals=new Map();
 adjacent.forEach(a=>{const k=xy(a.x,a.y);if(!goals.has(k))goals.set(k,[]);goals.get(k).push(a.target)});
 const q=[{x:start.x,y:start.y,n:0,first:null}],seen=new Map([[xy(start.x,start.y),q[0]]]);
 for(let i=0;i<q.length;i++){
  const v=q[i];
  for(const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]){
   const x=v.x+dx,y=v.y+dy,k=xy(x,y);
   if(!inBoard(x,y)||seen.has(k)||occupied.some(o=>o.x===x&&o.y===y))continue;
   const nxt={x,y,n:v.n+1,parent:v};
   seen.set(k,nxt);q.push(nxt);
  }
 }
 return {q,seen,goals};
}
function enemyAI(){
 const b=s.battle;if(!b)return;
 const targets=[{v:b.r,name:'ルノ',act:b.runLast},{v:b.f,name:'フラメト',act:b.flamLast}];
 const occupied=[b.r,b.f];
 const moveLimit=b.threat?1:3;
 const actionBonus=t=>({attack:25,threat:20,push:20}[t.act]||0);
 const scoreAt=(pos,t)=>{const d=dist(pos,t.v);return (d===1?50:d===2?35:d===3?20:5)+actionBonus(t)};
 const routes=shortestEnemyRoutes(b.e,targets,occupied);
 const reachableNow=routes.q.filter(v=>v.n<=moveLimit);
 // For a normal attack, select an attack-capable square first, even when it is
 // not the nearest by straight-line distance. Tie-break by target priority.
 const attackSquares=reachableNow.filter(v=>targets.some(t=>dist(v,t.v)===1));
 let dest;
 if(attackSquares.length){
  attackSquares.sort((a,c)=>{
   const sa=Math.max(...targets.filter(t=>dist(a,t.v)===1).map(t=>scoreAt(a,t)));
   const sc=Math.max(...targets.filter(t=>dist(c,t.v)===1).map(t=>scoreAt(c,t)));
   return sc-sa||a.n-c.n||a.y-c.y||a.x-c.x;
  });
  dest=attackSquares[0];
 }else{
  // All reachable adjacent squares are candidate goals. Choose one with the
  // shortest *walkable path*, then advance up to this turn's movement limit.
  const candidates=routes.q.filter(v=>routes.goals.has(xy(v.x,v.y)));
  candidates.sort((a,c)=>{
   const sa=Math.max(...routes.goals.get(xy(a.x,a.y)).map(t=>scoreAt(a,t)));
   const sc=Math.max(...routes.goals.get(xy(c.x,c.y)).map(t=>scoreAt(c,t)));
   return a.n-c.n||sc-sa||a.y-c.y||a.x-c.x;
  });
  if(candidates.length){
   const goal=candidates[0];
   // BFS's fixed neighbor order makes same-length routes deterministic.
   // Retrace the selected route and take only the allowed number of steps.
   const path=[]; let cur=goal;
   while(cur&&cur.n>0){path.push(cur);cur=routes.seen.get(xy(cur.x,cur.y))?.parent;}
   path.reverse();
   dest=path[Math.min(moveLimit,path.length)-1]||reachableNow[0];
  }else{
   // No route to either target: do not oscillate or phase through walls.
   dest=reachableNow[0];
  }
 }
 if(dest&&inBoard(dest.x,dest.y)){
  const moved=dist(b.e,dest)>0;
  b.e={x:dest.x,y:dest.y};
  if(moved)log('敵は岩壁を迂回し、攻撃できる位置へ近づいた。');
 }
 const avail=targets.filter(t=>dist(b.e,t.v)===1);
 if(avail.length){
  avail.sort((a,c)=>scoreAt(b.e,c)-scoreAt(b.e,a)||(a.name==='ルノ'?-1:1));
  const target=avail[0].name;
  let dmg=b.boss?(b.turn===2?12:b.turn===3?9:6):6;
  dmg=b.threat?Math.ceil(dmg*2/3):dmg;
  const defended=target==='ルノ'?b.guard:b.flametGuard;
  if(defended)dmg=Math.ceil(dmg/2);
  if(target==='ルノ'){s.hp=Math.max(0,s.hp-dmg);if(!defended)change(0,5)}
  else{s.fhp=Math.max(0,s.fhp-dmg);change(0,15)}
  log(`敵の攻撃：${target}に${dmg}ダメージ`);
 }else log('敵は通路を回り込みながら接近している。');
 b.threat=false;b.guard=false;b.flametGuard=false;
}

function flametAI(){
 const b=s.battle;if(!b||b.retreatPending)return;
 const low=s.fhp<=8,mid=s.fhp<=17;
 const options=reachable(b.f,4,[b.e]).filter(v=>!(v.x===b.r.x&&v.y===b.r.y));
 if(!options.length){b.flametGuard=true;b.flamLast='guard';log('フラメトはその場で防御した。');return;}
 if(low){
   options.sort((a,c)=>dist(c,b.e)-dist(a,b.e)||a.n-c.n);
   b.f={x:options[0].x,y:options[0].y};b.flametGuard=true;b.flamLast='guard';
   log('傷ついたフラメトは無理に戦わず、安全な場所へ下がった。');return;
 }
 const adjacent=options.filter(v=>dist(v,b.e)===1);
 // Body slam pushes the centipede away when it is threatening Runo.
 // Only valid empty floor tiles may be used as push destinations.
 const danger=dist(b.e,b.r)<=2;
 const pushes=adjacent.map(v=>{
    const dx=b.e.x-v.x,dy=b.e.y-v.y;
    const nx=b.e.x+dx,ny=b.e.y+dy;
    return {v,nx,ny,after:Math.abs(nx-b.r.x)+Math.abs(ny-b.r.y)};
 }).filter(q=>inBoard(q.nx,q.ny)&&!(q.nx===b.r.x&&q.ny===b.r.y)&&!(q.nx===q.v.x&&q.ny===q.v.y)&&q.after>dist(b.e,b.r));
 if(danger&&!mid&&s.karma<60&&pushes.length){
   pushes.sort((a,c)=>c.after-a.after||a.v.n-c.v.n);
   const q=pushes[0];b.f={x:q.v.x,y:q.v.y};b.e={x:q.nx,y:q.ny};
   b.enemyHp=Math.max(0,b.enemyHp-3);b.flamLast='push';
   log('フラメトの体当たり！ 敵HP−3、1マス押し戻した。');return;
 }
 const threatens=options.filter(v=>dist(v,b.e)<=3);
 if(threatens.length&&(mid||s.karma<60)&&danger){
   threatens.sort((a,c)=>a.n-c.n||dist(c,b.e)-dist(a,b.e));
   b.f={x:threatens[0].x,y:threatens[0].y};b.threat=true;b.flamLast='threat';
   log('フラメトはルノをかばう位置で吠えた。敵がひるんだ！ 移動力1・攻撃力2/3。');return;
 }
 if(adjacent.length&&!mid){
   adjacent.sort((a,c)=>a.n-c.n);b.f={x:adjacent[0].x,y:adjacent[0].y};
   b.enemyHp=Math.max(0,b.enemyHp-5);b.flamLast='attack';
   log('フラメトが噛みついた。敵HP−5');return;
 }
 if(threatens.length&&(mid||s.karma<60)){
   threatens.sort((a,c)=>a.n-c.n);b.f={x:threatens[0].x,y:threatens[0].y};
   b.threat=true;b.flamLast='threat';log('フラメトが威嚇して敵を牽制した。');return;
 }
 options.sort((a,c)=>dist(c,b.e)-dist(a,b.e)||a.n-c.n);
 b.f={x:options[0].x,y:options[0].y};b.flamLast='wait';log('フラメトが安全な位置へ移動した。');
}
function endTurn(){let b=s.battle;if(!b||b.retreatPending)return;flametAI();if(wormRetreat())return;if(b.enemyHp<=0){s.battle=null;next();render();return}if(b.turn===5){bossResolve();return}enemyAI();if(s.hp<=0||s.fhp<=0){s.gameover=true;s.battle=null;save();render();return}b.turn++;b.moved=false;b.acted=false;b.runLast='wait';b.flamLast='wait';save();render()}
function bossResolve(){let b=s.battle;if(b.enemyHp<=0){s.battle=null;next();render();return}if(b.boss&&b.enemyHp<=20){s.battle=null;s.step=0;save();render();modal('トゲイモムシの撤退','<p>弱ったトゲイモムシは身をよじり、闇の奥へ帰ろうとしている。</p>',[['逃がす（カルマ−5）',()=>{change(-5,0);next();render()},true],['追撃する（カルマ＋15）',()=>{change(15,0);next();render()}]]);return}if(!b.boss){s.battle=null;next();render();return}s.battle=null;s.step=0;save();render();modal('暴走・連続突進','<p>トゲイモムシは暴走し、距離に関係なく二人の目前まで突進してきた。どう避ける？</p>',[['二人で協力して回避（不安＋5）',()=>{change(0,5);next();render()}],['フラメトを先行させる（カルマ＋10・不安＋10）',()=>{change(10,10);next();render()}]])}
function retry(){if(!s.checkpoint){titleScreen();return}let c=s.checkpoint;s.hp=c.hp;s.fhp=c.fhp;s.karma=c.karma;s.anxiety=c.anxiety;s.scene=c.scene;s.step=c.step;s.crystal=c.crystal;s.gameover=false;startBattle(s.scene===8)}
function battleRender(){
 let b=s.battle;
 // Old saves can resume on the retreat threshold.
 if(wormRetreat())return;
 $('art').innerHTML='';$('combat').classList.remove('hidden');
 let d=dist(b.r,b.e),staffRange=d===1,stoneRange=d>=2&&d<=4;
 let staffOK=!b.acted&&s.anxiety<70&&staffRange;
 let stoneOK=!b.acted&&s.anxiety<50&&b.stones>0&&stoneRange;
 say(`敵HP ${b.enemyHp}/${b.enemyMax}　${b.turn}/5ターン。ルノは移動・行動を各1回、順序自由で実行できます。`, '戦闘');
 $('combat').replaceChildren();
 const map=document.createElement('div');map.className='gridbattle';map.setAttribute('aria-label','7×7の戦闘マップ');
 const moveCells=!b.moved?reachable(b.r,3,[b.e]).filter(v=>!(v.x===b.f.x&&v.y===b.f.y)):[];
 for(let y=0;y<7;y++)for(let x=0;x<7;x++){
  let cell=document.createElement('button'),k=xy(x,y);cell.className='tile '+(walls.has(k)?'wall':'floor');let mark='';
  let isEnemy=b.e.x===x&&b.e.y===y;
  let isR=b.r.x===x&&b.r.y===y, isF=b.f.x===x&&b.f.y===y;
  if(isR){cell.className='tile runo';mark='ル'}
  else if(isF){cell.className='tile flamet';mark='犬'}
  else if(isEnemy){cell.className='tile enemy';mark='虫'}
  else if(moveCells.some(v=>v.x===x&&v.y===y)){cell.className='tile reachable'}
  if(isEnemy&&(staffOK||stoneOK))cell.classList.add('attackable');
  if(isR||isF||isEnemy){
   const sprite=document.createElement('img');
   sprite.className='battleSprite '+(isEnemy?'battleSpriteEnemy':'battleSpriteHero')+' spriteIdle';
   sprite.src='assets/'+(isR?'battle_runo.png':isF?'battle_flamet.png':b.boss?'enemy_spiky_user.png':'enemy_centipede_user.png');
   sprite.alt=isR?'ルノ':isF?'フラメト':b.boss?'トゲイモムシ':'岩喰いムカデ';
   sprite.draggable=false;
   cell.append(sprite);
  }else{
   cell.textContent='';
  }
  if(isEnemy){cell.title=(staffOK?'クリックで杖攻撃':stoneOK?'クリックで石弾攻撃':`敵まで${d}マス。${b.acted?'このターンは行動済みです':'射程を確認してください'}`);cell.setAttribute('aria-label',cell.title)}
  else if(isR)cell.title='ルノ（現在位置）';else if(isF)cell.title='フラメト';
  else if(moveCells.some(v=>v.x===x&&v.y===y))cell.title='移動できるマス';
  cell.disabled=walls.has(k)||(!isEnemy&&!moveCells.some(v=>v.x===x&&v.y===y));
  cell.onclick=()=>{if(isEnemy){if(staffOK)action('staff');else if(stoneOK)action('stone');else{approachAttack()}}else moveR(x,y)};
  map.append(cell)
 }
 const panel=$('battlePanel');panel.innerHTML='<div class="panelTitle">戦闘コマンド</div>';panel.setAttribute('aria-label','戦闘コマンド一覧');
 const sideWrap=document.createElement('div');sideWrap.className='battlePanelInner';
 const side=document.createElement('div');side.className='battleSide';
 const info=document.createElement('div');info.className='combatInfo';info.innerHTML=`<b>${b.boss?'トゲイモムシ':'岩喰いムカデ'}</b>　HP <b>${b.enemyHp}/${b.enemyMax}</b><div class="enemyHpBar"><div style="width:${Math.max(0,b.enemyHp/b.enemyMax*100)}%"></div></div><span class="infoSub">第${b.turn}ターン　石弾 ${b.stones}　距離 ${d}　移動:${b.moved?'済':'未'}／行動:${b.acted?'済':'未'}</span>`;side.append(info);
 const help=document.createElement('div');help.className='actionHelp';
 help.textContent=b.acted?'このターンの行動は完了。移動が未完了なら移動できます。終了で次ターンへ。':s.anxiety>=70?'不安70以上のため攻撃不可。防御・落ち着く等を選択してください。':staffOK?'杖が届きます。黄色枠の敵か「杖で攻撃」を押してください。':stoneOK?'石弾が届きます。黄色枠の敵か「石弾」を押してください。':`敵まで${d}マス。『敵に近づいて攻撃』で射程まで自動移動できます。`;
 side.append(help);
 const bs=document.createElement('div');bs.className='battleBtns';
 function add(txt,type,disabled=false,reason=''){let btn=document.createElement('button');btn.textContent=txt;btn.disabled=disabled||b.acted;btn.title=b.acted?'行動済み：ターンを終了してください':reason;btn.onclick=()=>action(type);bs.append(btn)}
 add('杖攻撃 10','staff',s.anxiety>=70||!staffRange,s.anxiety>=70?'不安70以上':`敵まで${d}マス、必要距離1`);
 add(`石弾 7 (${b.stones})`,'stone',s.anxiety>=50||b.stones===0||!stoneRange,s.anxiety>=50?'不安50以上':b.stones===0?'石弾切れ':`敵まで${d}マス、必要距離2〜4`);
 add('防御','guard');add('落ち着く −20','calm',s.anxiety>=90,'パニック中は不可');
 add('フラメトに呼びかけ','call',s.karma>=60,'カルマ60以上');
 if(b.boss&&s.crystal&&b.turn>=3)add('◆ 水晶を使う','crystal');side.append(bs);
 const approach=document.createElement('button');approach.className='primary approach';approach.textContent='敵に近づいて攻撃';approach.disabled=b.acted;approach.onclick=approachAttack;side.append(approach);
 const fin=document.createElement('button');fin.textContent='ターン終了 ▶';fin.className='primary endturn';fin.onclick=endTurn;side.append(fin);
 const retryBtn=document.createElement('button');retryBtn.textContent='戦闘をやり直す';retryBtn.className='retryBattle';retryBtn.onclick=retry;side.append(retryBtn);
 sideWrap.append(side);panel.append(sideWrap);
 $('combat').append(map);if(battleEffect){const effect=document.createElement('div');effect.id='battleEffect';effect.className='battleEffect effect-'+battleEffect.kind;effect.textContent=battleEffect.message;$('combat').append(effect)}setSideLog(b.logs.join('\n'));
}
function titleScreen(){s.paused=true;save();modal('マルクヴィエ物語',`<p>少年ルノと相棒フラメトは、命継ぎの石を探して廃坑へ向かう。</p><p>展示版：全10区画／20分上限／4種類の結末。PC・スマートフォン対応。</p><p class="tiny">「はじめから」では現在のプレイデータを上書きします。</p>`,[['続きから',()=>{s.paused=false;render()},true],['はじめから（新しいプレイ）',()=>{s=blank();render()}]])}
const _titleScreen=titleScreen;titleScreen=function(){setSideLog('タイトルに戻るとゲームを中断できます。\n「続きから」で自動保存データを再開できます。');return _titleScreen.apply(this,arguments)};$('nextDialog').onclick=advanceDialog;document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!modalOpen&&!$('nextDialog').classList.contains('hidden')&&e.target===document.body){e.preventDefault();advanceDialog()}});$('titleBtn').onclick=()=>titleScreen();$('pauseBtn').onclick=()=>{s.paused=true;save();modal('一時停止','<p>時間計測を一時停止しています。</p>',[['再開',()=>{s.paused=false;render()},true],['タイトルに戻る',titleScreen]])};
window.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(document.hidden&&s&&!s.ending){s.paused=true;save()}else if(!document.hidden&&s?.paused&&!modalOpen){modal('一時停止中','<p>ゲームを再開できます。</p>',[['再開',()=>{s.paused=false;render()},true]])}});
s=load()||blank();render();titleScreen();setInterval(tick,200);
